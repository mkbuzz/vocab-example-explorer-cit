name: Apply placeholder chips

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_placeholder_chips.py'
      - '.github/workflows/apply-placeholder-chips.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply placeholder chips
        run: python .github/scripts/apply_placeholder_chips.py
      - name: Commit updated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Style A/B placeholders as chips"
          git push
